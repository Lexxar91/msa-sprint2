version: v1
replicaCount: 1

image:
  name: booking-service
  tag: latest
  pullPolicy: IfNotPresent

service:
  name: booking-service
  create: true
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: '100m'
    memory: '128Mi'
  limits:
    cpu: '200m'
    memory: '256Mi'

livenessProbe:
  httpGet:
    path: /ping
    port: http
  initialDelaySeconds: 10
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /ping
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 2

env:
  - name: ENABLE_FEATURE_X
    value: 'true'
