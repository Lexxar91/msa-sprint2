[tool.ruff]
line-length = 79
target-version = "py314"
extend-exclude = ["*_pb2.py", "*_pb2_grpc.py", "tasks/results"]

[tool.ruff.lint]
select = ["E", "F", "W", "D"]
ignore = ["E501", "F401"]

[tool.ruff.lint.per-file-ignores]
"tasks/task2/booking-service/main.py" = ["E402"]
"tasks/task2/booking-service/test_client.py" = ["E402"]

[tool.ruff.lint.pydocstyle]
convention = "google"
